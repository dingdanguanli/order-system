<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔐 总管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, Arial, sans-serif; background: #f0f2f5; padding: 12px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; }

        .login-box { background: white; max-width: 360px; margin: 60px auto; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .login-box h2 { text-align: center; font-size: 20px; margin-bottom: 4px; }
        .login-box p.sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin-bottom: 12px; background: #fafafa; }
        .login-box input:focus { outline: none; border-color: #4a6cf7; background: white; }
        .login-box button { width: 100%; padding: 14px; background: #4a6cf7; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 600; cursor: pointer; }
        .login-box button:active { background: #3a56d4; }
        .login-error { color: #ff4757; text-align: center; font-size: 14px; margin-top: 12px; display: none; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 18px; color: #333; }
        .header .info { font-size: 13px; color: #999; }
        .header .logout-btn { background: none; border: 1px solid #ddd; padding: 6px 16px; border-radius: 8px; font-size: 13px; color: #666; cursor: pointer; }

        .stats { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .stats .stat-item { background: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #666; border: 1px solid #eee; cursor: pointer; }
        .stats .stat-item.active { background: #4a6cf7; color: white; border-color: #4a6cf7; }
        .stats .stat-item .num { font-weight: 700; margin-right: 2px; }

        .order-card { background: white; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .order-card .top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 4px; }
        .order-card .top .name { font-weight: 600; font-size: 15px; color: #333; }
        .order-card .top .phone { color: #666; font-size: 13px; }
        .order-card .top .time { color: #bbb; font-size: 11px; }
        .order-card .info { margin-top: 6px; font-size: 13px; color: #666; line-height: 1.6; }
        .order-card .bottom { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 10px; }
        .order-card .bottom select { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; flex: 1; min-width: 70px; }
        .order-card .bottom input { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; flex: 1; min-width: 70px; }
        .order-card .bottom input:focus { outline: none; border-color: #4a6cf7; }
        .order-card .bottom .btn-save { padding: 6px 16px; background: #4a6cf7; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .order-card .bottom .btn-danger { padding: 6px 16px; background: #ff6b6b; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }

        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .badge.shipped { background: #d4edda; color: #155724; }
        .badge.rejected { background: #f8d7da; color: #721c24; }
        .pickup-highlight { color: #ff6b00; font-weight: 700; font-size: 16px; }
        .agent-tag { font-size: 11px; color: #999; background: #f0f0f0; padding: 1px 10px; border-radius: 12px; }

        .empty-tip, .loading { text-align: center; color: #ccc; padding: 30px 0; font-size: 14px; }
        .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: white; padding: 10px 20px; border-radius: 10px; font-size: 14px; z-index: 999; display: none; max-width: 80%; text-align: center; }
        .toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; background: white; border-radius: 10px; padding: 4px; }
        .tab-bar button { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; background: transparent; color: #999; }
        .tab-bar button.active { background: #4a6cf7; color: white; }

        .settings-area { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
        .settings-area .form-group { margin-bottom: 12px; }
        .settings-area .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 4px; font-weight: 500; }
        .settings-area .form-group input, .settings-area .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; }
        .settings-area .form-group textarea { min-height: 80px; resize: vertical; }
        .settings-area .btn-save-settings { padding: 10px 24px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .settings-area .preview-img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 6px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <!-- ====== 登录界面 ====== -->
    <div id="loginBox" class="login-box">
        <h2>🔐 总管理后台</h2>
        <p class="sub">请输入管理密码</p>
        <input id="pwdInput" type="password" placeholder="请输入密码" onkeyup="if(event.keyCode===13) doLogin()">
        <button onclick="doLogin()">登 录</button>
        <p id="loginError" class="login-error">❌ 密码错误，请重试</p>
        <div style="text-align:center;margin-top:12px;font-size:12px;color:#ccc;">
            默认密码: Aa7758521
        </div>
    </div>

    <!-- ====== 管理界面 ====== -->
    <div id="adminPanel" style="display:none;">
        <div class="header">
            <div>
                <h1>📦 总管理后台</h1>
                <span class="info" id="adminInfo">总管理员</span>
            </div>
            <button class="logout-btn" onclick="doLogout()">退出</button>
        </div>

        <!-- Tab 切换 -->
        <div class="tab-bar">
            <button class="active" onclick="switchTab('orders')" id="tabOrdersBtn">📋 订单管理</button>
            <button onclick="switchTab('settings')" id="tabSettingsBtn">⚙️ 页面设置</button>
            <button onclick="switchTab('recycle')" id="tabRecycleBtn">🗑️ 回收站</button>
        </div>

        <!-- ===== Tab1：订单管理 ===== -->
        <div id="tabOrders" class="tab-content">
            <div class="stats" id="statsBar">
                <span class="stat-item active" data-status="all" onclick="loadOrders('all',this)">全部 <span class="num" id="countAll">0</span></span>
                <span class="stat-item" data-status="0" onclick="loadOrders('0',this)">⏳ 待处理 <span class="num" id="count0">0</span></span>
                <span class="stat-item" data-status="1" onclick="loadOrders('1',this)">✅ 已发货 <span class="num" id="count1">0</span></span>
                <span class="stat-item" data-status="2" onclick="loadOrders('2',this)">❌ 已拒绝 <span class="num" id="count2">0</span></span>
            </div>
            <div id="orderList"></div>
        </div>

        <!-- ===== Tab2：页面设置 ===== -->
        <div id="tabSettings" class="tab-content" style="display:none;">
            <div class="settings-area">
                <h3 style="margin-bottom:12px;font-size:16px;color:#333;">⚙️ 页面设置</h3>
                <div class="form-group">
                    <label>选择代理商</label>
                    <select id="settingAgentId">
                        <option value="1">深圳总仓1001</option>
                        <option value="2">深圳总仓1002</option>
                        <option value="3">深圳总仓1003</option>
                        <option value="4">深圳总仓1004</option>
                        <option value="5">深圳总仓1005</option>
                        <option value="6">深圳总仓1006</option>
                        <option value="7">深圳总仓1007</option>
                        <option value="8">深圳总仓1008</option>
                        <option value="9">深圳总仓1009</option>
                        <option value="10">深圳总仓1010</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>库存图片 URL</label>
                    <input id="settingStockImage" placeholder="https://example.com/stock.jpg">
                    <div id="stockPreview"></div>
                </div>
                <div class="form-group">
                    <label>下单注意事项</label>
                    <textarea id="settingOrderNotice" placeholder="请填写下单注意事项，如：发货时间、物流说明等"></textarea>
                </div>
                <button class="btn-save-settings" onclick="saveSettings()">💾 保存设置</button>
            </div>
        </div>

        <!-- ===== Tab3：回收站 ===== -->
        <div id="tabRecycle" class="tab-content" style="display:none;">
            <div class="stats">
                <span class="stat-item active" onclick="loadRecycle()">🗑️ 回收站</span>
            </div>
            <div id="recycleList"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 配置 - 总管理员密码
// ============================================================
const API_BASE = 'https://order-api.dingdanguanli.workers.dev';
const MASTER_PASSWORD = 'Aa7758521';

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// 登录
// ============================================================
function doLogin() {
    const pwd = document.getElementById('pwdInput').value.trim();
    if (pwd === MASTER_PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('loginError').style.display = 'none';
        loadOrders('all');
    } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
    }
}

function doLogout() {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('pwdInput').value = '';
    document.getElementById('loginError').style.display = 'none';
}

// ============================================================
// Tab 切换
// ============================================================
function switchTab(tab) {
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    
    if (tab === 'orders') {
        document.getElementById('tabOrdersBtn').classList.add('active');
        document.getElementById('tabOrders').style.display = 'block';
        loadOrders('all');
    } else if (tab === 'settings') {
        document.getElementById('tabSettingsBtn').classList.add('active');
        document.getElementById('tabSettings').style.display = 'block';
        loadSettings();
    } else if (tab === 'recycle') {
        document.getElementById('tabRecycleBtn').classList.add('active');
        document.getElementById('tabRecycle').style.display = 'block';
        loadRecycle();
    }
}

// ============================================================
// 加载订单列表
// ============================================================
async function loadOrders(status, el) {
    document.querySelectorAll('#statsBar .stat-item').forEach(item => item.classList.remove('active'));
    if (el) el.classList.add('active');

    const list = document.getElementById('orderList');
    list.innerHTML = '<div class="loading">⏳ 加载中...</div>';

    try {
        const resp = await fetch(`${API_BASE}/api/master/orders?password=${MASTER_PASSWORD}&status=${status}&deleted=0`);
        const data = await resp.json();

        if (data.code === 401) {
            showToast('密码错误，请重新登录');
            doLogout();
            return;
        }

        if (data.code === 200 && data.data) {
            const orders = data.data;
            renderOrders(orders, status);
            updateCounts(orders);
        } else {
            list.innerHTML = '<div class="empty-tip">暂无订单</div>';
        }
    } catch (e) {
        list.innerHTML = '<div class="empty-tip">加载失败，请刷新</div>';
        console.error(e);
    }
}

function renderOrders(orders, status) {
    const list = document.getElementById('orderList');
    if (!orders || orders.length === 0) {
        list.innerHTML = '<div class="empty-tip">🎉 暂无订单</div>';
        return;
    }

    const statusMap = ['待处理', '已发货', '已拒绝'];
    const statusClass = ['pending', 'shipped', 'rejected'];
    const agentNames = {
        1: '深圳总仓1001',
        2: '深圳总仓1002',
        3: '深圳总仓1003',
        4: '深圳总仓1004',
        5: '深圳总仓1005',
        6: '深圳总仓1006',
        7: '深圳总仓1007',
        8: '深圳总仓1008',
        9: '深圳总仓1009',
        10: '深圳总仓1010'
    };

    let html = '';
    orders.forEach(order => {
        html += `
            <div class="order-card" data-id="${order.id}">
                <div class="top">
                    <div>
                        <span class="badge ${statusClass[order.status] || 'pending'}">${statusMap[order.status] || '未知'}</span>
                        <span class="name">${order.customer_name}</span>
                        <span class="phone">${order.customer_phone}</span>
                        <span class="agent-tag">${agentNames[order.agent_id] || '未知'}</span>
                    </div>
                    <span class="time">${order.created_at || ''}</span>
                </div>
                <div class="info">
                    <div>📍 ${order.customer_address}</div>
                    <div>📝 ${order.product_note || '无备注'}</div>
                </div>
                <div class="bottom">
                    <select onchange="updateOrder(${order.id}, 'status', this.value)">
                        <option value="0" ${order.status === 0 ? 'selected' : ''}>待处理</option>
                        <option value="1" ${order.status === 1 ? 'selected' : ''}>已发货</option>
                        <option value="2" ${order.status === 2 ? 'selected' : ''}>已拒绝</option>
                    </select>
                    <input type="text" placeholder="运单号" value="${order.tracking_number || ''}" 
                           onchange="updateOrder(${order.id}, 'tracking_number', this.value)">
                    <input type="text" placeholder="取件码" value="${order.pickup_code || ''}" 
                           onchange="updateOrder(${order.id}, 'pickup_code', this.value)">
                    <input type="text" placeholder="备注" value="${order.admin_remark || ''}" 
                           onchange="updateOrder(${order.id}, 'admin_remark', this.value)">
                    <button class="btn-save" onclick="updateOrder(${order.id})">💾 保存</button>
                    <button class="btn-danger" onclick="deleteOrder(${order.id})">🗑️ 删除</button>
                </div>
            </div>
        `;
    });
    list.innerHTML = html;
}

// ============================================================
// 更新订单
// ============================================================
async function updateOrder(id, field, value) {
    if (field) {
        clearTimeout(window._updateTimer);
        window._updateTimer = setTimeout(async () => {
            await doUpdateOrder(id);
        }, 500);
        return;
    }
    await doUpdateOrder(id);
}

async function doUpdateOrder(id) {
    const card = document.querySelector(`.order-card[data-id="${id}"]`);
    if (!card) return;

    const select = card.querySelector('select');
    const inputs = card.querySelectorAll('input');
    const status = parseInt(select.value);
    const trackingNumber = inputs[0].value.trim();
    const pickupCode = inputs[1].value.trim();
    const adminRemark = inputs[2].value.trim();

    const btn = card.querySelector('.btn-save');
    btn.textContent = '⏳';
    btn.disabled = true;

    try {
        const resp = await fetch(`${API_BASE}/api/master/order/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                password: MASTER_PASSWORD,
                id: id,
                status: status,
                trackingNumber: trackingNumber,
                pickupCode: pickupCode,
                adminRemark: adminRemark
            })
        });
        const data = await resp.json();

        if (data.code === 200) {
            showToast('✅ 保存成功');
            const activeStatus = document.querySelector('#statsBar .stat-item.active');
            const status = activeStatus ? activeStatus.dataset.status : 'all';
            loadOrders(status, activeStatus);
        } else {
            showToast(data.msg || '保存失败');
            btn.textContent = '💾 保存';
            btn.disabled = false;
        }
    } catch (e) {
        showToast('网络异常，请重试');
        btn.textContent = '💾 保存';
        btn.disabled = false;
        console.error(e);
    }
}

// ============================================================
// 删除订单（软删除，移入回收站）
// ============================================================
async function deleteOrder(id) {
    if (!confirm('确定要删除此订单吗？将移入回收站')) return;

    try {
        const resp = await fetch(`${API_BASE}/api/master/order/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                password: MASTER_PASSWORD,
                id: id
            })
        });
        const data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 已移入回收站');
            const activeStatus = document.querySelector('#statsBar .stat-item.active');
            const status = activeStatus ? activeStatus.dataset.status : 'all';
            loadOrders(status, activeStatus);
        } else {
            showToast(data.msg || '删除失败');
        }
    } catch (e) {
        showToast('网络异常，请重试');
    }
}

// ============================================================
// 回收站
// ============================================================
async function loadRecycle() {
    const list = document.getElementById('recycleList');
    list.innerHTML = '<div class="loading">⏳ 加载中...</div>';

    try {
        const resp = await fetch(`${API_BASE}/api/master/orders?password=${MASTER_PASSWORD}&deleted=1`);
        const data = await resp.json();

        if (data.code === 200 && data.data) {
            const orders = data.data;
            if (orders.length === 0) {
                list.innerHTML = '<div class="empty-tip">🗑️ 回收站为空</div>';
                return;
            }
            let html = '';
            orders.forEach(order => {
                html += `
                    <div class="order-card">
                        <div class="top">
                            <div>
                                <span class="name">${order.customer_name}</span>
                                <span class="phone">${order.customer_phone}</span>
                            </div>
                            <span class="time">${order.created_at || ''}</span>
                        </div>
                        <div class="info">
                            <div>📍 ${order.customer_address}</div>
                            <div>📝 ${order.product_note || '无备注'}</div>
                        </div>
                        <div class="bottom">
                            <button class="btn-save" onclick="restoreOrder(${order.id})">↩️ 恢复</button>
                            <button class="btn-danger" onclick="permanentDelete(${order.id})">🔥 彻底删除</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        } else {
            list.innerHTML = '<div class="empty-tip">回收站加载失败</div>';
        }
    } catch (e) {
        list.innerHTML = '<div class="empty-tip">加载失败，请刷新</div>';
    }
}

// ============================================================
// 恢复订单
// ============================================================
async function restoreOrder(id) {
    if (!confirm('确定要恢复此订单吗？')) return;
    try {
        const resp = await fetch(`${API_BASE}/api/master/order/restore`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: MASTER_PASSWORD, id: id })
        });
        const data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 已恢复');
            loadRecycle();
        } else {
            showToast(data.msg || '恢复失败');
        }
    } catch (e) {
        showToast('网络异常，请重试');
    }
}

// ============================================================
// 彻底删除
// ============================================================
async function permanentDelete(id) {
    if (!confirm('⚠️ 确定要彻底删除此订单吗？此操作不可恢复！')) return;
    try {
        const resp = await fetch(`${API_BASE}/api/master/order/permanent-delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: MASTER_PASSWORD, id: id })
        });
        const data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 已彻底删除');
            loadRecycle();
        } else {
            showToast(data.msg || '删除失败');
        }
    } catch (e) {
        showToast('网络异常，请重试');
    }
}

// ============================================================
// 更新统计数
// ============================================================
function updateCounts(orders) {
    const counts = { 0: 0, 1: 0, 2: 0 };
    orders.forEach(o => {
        if (counts[o.status] !== undefined) counts[o.status]++;
    });
    document.getElementById('countAll').textContent = orders.length;
    document.getElementById('count0').textContent = counts[0];
    document.getElementById('count1').textContent = counts[1];
    document.getElementById('count2').textContent = counts[2];
}

// ============================================================
// 页面设置
// ============================================================
async function loadSettings() {
    const agentId = document.getElementById('settingAgentId').value;
    try {
        const resp = await fetch(`${API_BASE}/api/agent/config?agentId=${agentId}`);
        const data = await resp.json();
        if (data.code === 200) {
            document.getElementById('settingStockImage').value = data.data.stock_image_url || '';
            document.getElementById('settingOrderNotice').value = data.data.order_notice || '';
            updateStockPreview(data.data.stock_image_url || '');
        }
    } catch (e) {
        console.error(e);
    }
}

function updateStockPreview(url) {
    const preview = document.getElementById('stockPreview');
    if (url) {
        preview.innerHTML = `<img src="${url}" class="preview-img" alt="库存图片预览" onerror="this.style.display='none'">`;
    } else {
        preview.innerHTML = '';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('settingStockImage').addEventListener('input', function() {
        updateStockPreview(this.value);
    });
    document.getElementById('settingAgentId').addEventListener('change', function() {
        loadSettings();
    });
});

async function saveSettings() {
    const agentId = document.getElementById('settingAgentId').value;
    const stockImageUrl = document.getElementById('settingStockImage').value.trim();
    const orderNotice = document.getElementById('settingOrderNotice').value.trim();

    try {
        const resp = await fetch(`${API_BASE}/api/master/settings/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                password: MASTER_PASSWORD,
                agentId: parseInt(agentId),
                stockImageUrl: stockImageUrl,
                orderNotice: orderNotice
            })
        });
        const data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 设置已保存');
        } else {
            showToast(data.msg || '保存失败');
        }
    } catch (e) {
        showToast('网络异常，请重试');
    }
}
</script>
</body>
