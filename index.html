<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📦 快递查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, Arial, sans-serif; background: #f5f6fa; padding: 16px; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; padding: 16px 0 12px; }
        .header h1 { font-size: 26px; color: #333; }
        .header .agent-name { color: #4a6cf7; font-weight: 600; font-size: 15px; display: block; margin-top: 4px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: white; border-radius: 12px; padding: 4px; }
        .tabs button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; background: transparent; color: #999; }
        .tabs button.active { background: #4a6cf7; color: white; }

        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; display: none; }
        .card.active { display: block; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 4px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; background: #fafafa; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #4a6cf7; background: white; }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 17px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #4a6cf7; color: white; }
        .btn-primary:active { background: #3a56d4; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:active { background: #16a34a; }

        .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: white; padding: 12px 24px; border-radius: 10px; font-size: 15px; z-index: 999; display: none; max-width: 80%; text-align: center; }
        .toast.show { display: block; }

        .order-item { border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .order-item .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
        .order-item .top .status { font-size: 12px; padding: 2px 12px; border-radius: 20px; }
        .order-item .top .status.s0 { background: #fff3cd; color: #856404; }
        .order-item .top .status.s1 { background: #cce5ff; color: #004085; }
        .order-item .top .status.s2 { background: #d4edda; color: #155724; }
        .order-item .top .status.s3 { background: #d4edda; color: #155724; }
        .order-item .top .status.s4 { background: #f8d7da; color: #721c24; }
        .order-item .info { font-size: 14px; color: #666; line-height: 1.8; margin-top: 6px; }
        .order-item .info .pickup { font-size: 20px; font-weight: 700; color: #ff6b00; }
        .order-item .info .tracking { color: #333; font-weight: 500; }
        .order-item .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        .order-item .actions button { padding: 6px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
        .order-item .actions .btn-edit { background: #4a6cf7; color: white; }
        .order-item .actions .btn-pay { background: #22c55e; color: white; }

        .empty { text-align: center; color: #bbb; padding: 30px 0; }

        .contact-area { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; text-align: center; }
        .contact-area .qq-btn { display: inline-block; padding: 10px 28px; background: #4a6cf7; color: white; border-radius: 10px; text-decoration: none; font-weight: 500; font-size: 15px; }
        .contact-area .wechat-info { margin-top: 8px; color: #666; font-size: 14px; }
        .contact-area .qr-img { max-width: 140px; margin-top: 8px; border-radius: 8px; }
        .contact-area .welcome-text { margin-top: 8px; font-size: 13px; color: #999; }

        .stock-image { width: 100%; border-radius: 12px; margin-bottom: 16px; }
        .order-notice { background: #f8f9fa; border-radius: 10px; padding: 12px 16px; margin-top: 16px; font-size: 14px; color: #666; line-height: 1.8; border-left: 3px solid #4a6cf7; }
        .copy-btn { background: none; border: 1px solid #ddd; padding: 2px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; color: #666; }
        .copy-btn:active { background: #f0f0f0; }

        /* 查看库存浮动按钮 */
        .stock-fab {
            position: fixed;
            bottom: 30px;
            left: 20px;
            z-index: 999;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stock-fab:active { transform: scale(0.95); }

        /* 库存图片弹窗 */
        .stock-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .stock-modal.show { display: flex; }
        .stock-modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            position: relative;
        }
        .stock-modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
        }
        .stock-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }
        .stock-modal-close:hover { color: #333; }

        /* 修改订单弹窗 */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .edit-modal.show { display: flex; }
        .edit-modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            max-height: 90%;
            overflow-y: auto;
            position: relative;
        }
        .edit-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }
        .edit-modal-close:hover { color: #333; }
        .edit-modal-content .form-group { margin-bottom: 12px; }
        .edit-modal-content .btn { margin-top: 8px; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <div class="header">
        <h1>📦 快递查询</h1>
        <span class="agent-name" id="agentDisplay">加载中...</span>
    </div>

    <div class="tabs">
        <button class="active" onclick="switchTab('order')">📝 下单</button>
        <button onclick="switchTab('query')">🔍 查订单</button>
    </div>

    <!-- ===== Tab1：下单 ===== -->
    <div id="tabOrder" class="card active">
        <div id="stockImageArea"></div>
        <div class="form-group">
            <label>收件人姓名 *</label>
            <input id="oName" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>手机号码 *</label>
            <input id="oPhone" type="tel" placeholder="请输入手机号">
        </div>
        <div style="display:flex;gap:8px;">
            <div class="form-group" style="flex:1;">
                <label>省份 *</label>
                <select id="oProvince" onchange="updateCity()"><option value="">请选择</option></select>
            </div>
            <div class="form-group" style="flex:1;">
                <label>城市 *</label>
                <select id="oCity" onchange="updateDistrict()"><option value="">请选择</option></select>
            </div>
            <div class="form-group" style="flex:1;">
                <label>区/县 *</label>
                <select id="oDistrict"><option value="">请选择</option></select>
            </div>
        </div>
        <div class="form-group">
            <label>详细地址 *</label>
            <input id="oDetailAddress" placeholder="街道、门牌号等">
        </div>
        <div class="form-group">
            <label>商品备注</label>
            <textarea id="oNote" placeholder="如：红色款 M码 加急"></textarea>
        </div>
        <button class="btn btn-success" onclick="doOrder()">📝 提交订单</button>
        <div id="orderNoticeArea"></div>
        <div class="contact-area">
            <p style="color:#999;font-size:14px;margin-bottom:8px;">💬 联系客服</p>
            <div id="contactContent">加载中...</div>
        </div>
    </div>

    <!-- ===== Tab2：查询 ===== -->
    <div id="tabQuery" class="card">
        <div class="form-group">
            <label>输入手机号查订单 *</label>
            <input id="qPhone" type="tel" placeholder="请输入下单时的手机号" onkeyup="if(event.keyCode===13) doQuery()">
        </div>
        <button class="btn btn-primary" onclick="doQuery()">🔍 查询我的订单</button>
        <div id="orderList" style="margin-top:16px;"></div>
    </div>
</div>

<!-- 查看库存浮动按钮 -->
<button class="stock-fab" onclick="openStockModal()">📦 查看库存</button>

<!-- 库存图片弹窗 -->
<div class="stock-modal" id="stockModal" onclick="if(event.target===this)closeStockModal()">
    <div class="stock-modal-content">
        <button class="stock-modal-close" onclick="closeStockModal()">✕</button>
        <div id="stockModalBody" style="text-align:center;"><p style="color:#999;padding:20px;">加载中...</p></div>
    </div>
</div>

<!-- 修改订单弹窗 -->
<div class="edit-modal" id="editModal" onclick="if(event.target===this)closeEditModal()">
    <div class="edit-modal-content">
        <button class="edit-modal-close" onclick="closeEditModal()">✕</button>
        <h3 style="margin-bottom:16px;">✏️ 修改订单</h3>
        <div id="editForm">
            <div class="form-group"><label>收件人姓名 *</label><input id="eName" placeholder="请输入姓名"></div>
            <div class="form-group"><label>手机号码 *</label><input id="ePhone" type="tel" placeholder="请输入手机号"></div>
            <div style="display:flex;gap:8px;">
                <div class="form-group" style="flex:1;"><label>省份 *</label><select id="eProvince" onchange="updateEditCity()"><option value="">请选择</option></select></div>
                <div class="form-group" style="flex:1;"><label>城市 *</label><select id="eCity" onchange="updateEditDistrict()"><option value="">请选择</option></select></div>
                <div class="form-group" style="flex:1;"><label>区/县 *</label><select id="eDistrict"><option value="">请选择</option></select></div>
            </div>
            <div class="form-group"><label>详细地址 *</label><input id="eDetailAddress" placeholder="街道、门牌号等"></div>
            <div class="form-group"><label>商品备注</label><textarea id="eNote" placeholder="如：红色款 M码 加急"></textarea></div>
            <button class="btn btn-success" onclick="submitEdit()">✅ 确认修改</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// 配置
// ============================================================
const API_BASE = 'https://order-api.dingdanguanli.workers.dev';
let currentAgentId = 1;
let agentConfig = {};
let editingOrderId = null;

// ============================================================
// 省市区数据
// ============================================================
const regionData = {
    "广东省": { "广州市": ["天河区", "白云区", "番禺区", "海珠区", "越秀区", "荔湾区", "黄埔区", "花都区", "南沙区", "从化区", "增城区"], "深圳市": ["南山区", "福田区", "罗湖区", "宝安区", "龙岗区", "龙华区", "光明区", "坪山区", "盐田区", "大鹏新区"], "东莞市": ["南城街道", "东城街道", "万江街道", "莞城街道", "松山湖"], "佛山市": ["禅城区", "南海区", "顺德区", "三水区", "高明区"], "珠海市": ["香洲区", "斗门区", "金湾区"], "中山市": ["石岐街道", "东区街道", "西区街道", "南区街道"], "惠州市": ["惠城区", "惠阳区", "博罗县", "惠东县", "龙门县"], "江门市": ["蓬江区", "江海区", "新会区", "台山市", "开平市", "鹤山市", "恩平市"], "肇庆市": ["端州区", "鼎湖区", "高要区", "四会市", "广宁县", "怀集县", "封开县", "德庆县"], "汕头市": ["金平区", "龙湖区", "濠江区", "澄海区", "潮阳区", "潮南区", "南澳县"], "潮州市": ["湘桥区", "潮安区", "饶平县"], "揭阳市": ["榕城区", "揭东区", "揭西县", "惠来县", "普宁市"], "汕尾市": ["城区", "海丰县", "陆河县", "陆丰市"], "湛江市": ["赤坎区", "霞山区", "坡头区", "麻章区", "遂溪县", "徐闻县", "廉江市", "雷州市", "吴川市"], "茂名市": ["茂南区", "电白区", "高州市", "化州市", "信宜市"], "阳江市": ["江城区", "阳东区", "阳西县", "阳春市"], "清远市": ["清城区", "清新区", "佛冈县", "阳山县", "连山壮族瑶族自治县", "连南瑶族自治县", "英德市", "连州市"], "韶关市": ["浈江区", "武江区", "曲江区", "始兴县", "仁化县", "翁源县", "乳源瑶族自治县", "乐昌市", "南雄市"], "河源市": ["源城区", "紫金县", "龙川县", "连平县", "和平县", "东源县"], "梅州市": ["梅江区", "梅县区", "大埔县", "丰顺县", "五华县", "平远县", "蕉岭县", "兴宁市"], "云浮市": ["云城区", "云安区", "新兴县", "郁南县", "罗定市"]
};
regionData["北京市"] = { "北京市": ["东城区", "西城区", "朝阳区", "海淀区", "丰台区", "石景山区", "通州区", "大兴区", "顺义区", "昌平区", "房山区", "门头沟区", "怀柔区", "平谷区", "密云区", "延庆区"] };
regionData["上海市"] = { "上海市": ["黄浦区", "徐汇区", "长宁区", "静安区", "普陀区", "虹口区", "杨浦区", "闵行区", "宝山区", "嘉定区", "浦东新区", "金山区", "松江区", "青浦区", "奉贤区", "崇明区"] };
regionData["浙江省"] = { "杭州市": ["上城区", "拱墅区", "西湖区", "滨江区", "萧山区", "余杭区", "临平区", "钱塘区", "富阳区", "临安区", "桐庐县", "淳安县", "建德市"], "宁波市": ["海曙区", "鄞州区", "江北区", "北仑区", "镇海区", "奉化区", "象山县", "宁海县", "余姚市", "慈溪市"] };
regionData["江苏省"] = { "南京市": ["玄武区", "秦淮区", "建邺区", "鼓楼区", "浦口区", "栖霞区", "雨花台区", "江宁区", "六合区", "溧水区", "高淳区"], "苏州市": ["姑苏区", "吴中区", "相城区", "吴江区", "虎丘区", "常熟市", "张家港市", "昆山市", "太仓市"] };

// ============================================================
// 初始化省市区下拉框
// ============================================================
function initProvince() {
    const select = document.getElementById('oProvince');
    select.innerHTML = '<option value="">请选择</option>';
    for (const p in regionData) {
        select.innerHTML += `<option value="${p}">${p}</option>`;
    }
}
function initEditProvince() {
    const select = document.getElementById('eProvince');
    select.innerHTML = '<option value="">请选择</option>';
    for (const p in regionData) {
        select.innerHTML += `<option value="${p}">${p}</option>`;
    }
}
function updateCity() {
    const p = document.getElementById('oProvince').value;
    const citySelect = document.getElementById('oCity');
    const districtSelect = document.getElementById('oDistrict');
    citySelect.innerHTML = '<option value="">请选择</option>';
    districtSelect.innerHTML = '<option value="">请选择</option>';
    if (p && regionData[p]) {
        for (const c in regionData[p]) {
            citySelect.innerHTML += `<option value="${c}">${c}</option>`;
        }
    }
}
function updateEditCity() {
    const p = document.getElementById('eProvince').value;
    const citySelect = document.getElementById('eCity');
    const districtSelect = document.getElementById('eDistrict');
    citySelect.innerHTML = '<option value="">请选择</option>';
    districtSelect.innerHTML = '<option value="">请选择</option>';
    if (p && regionData[p]) {
        for (const c in regionData[p]) {
            citySelect.innerHTML += `<option value="${c}">${c}</option>`;
        }
    }
}
function updateDistrict() {
    const p = document.getElementById('oProvince').value;
    const c = document.getElementById('oCity').value;
    const districtSelect = document.getElementById('oDistrict');
    districtSelect.innerHTML = '<option value="">请选择</option>';
    if (p && c && regionData[p] && regionData[p][c]) {
        regionData[p][c].forEach(d => {
            districtSelect.innerHTML += `<option value="${d}">${d}</option>`;
        });
    }
}
function updateEditDistrict() {
    const p = document.getElementById('eProvince').value;
    const c = document.getElementById('eCity').value;
    const districtSelect = document.getElementById('eDistrict');
    districtSelect.innerHTML = '<option value="">请选择</option>';
    if (p && c && regionData[p] && regionData[p][c]) {
        regionData[p][c].forEach(d => {
            districtSelect.innerHTML += `<option value="${d}">${d}</option>`;
        });
    }
}

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// Tab切换
// ============================================================
function switchTab(tab) {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    if (tab === 'order') {
        document.querySelector('.tabs button:first-child').classList.add('active');
        document.getElementById('tabOrder').classList.add('active');
    } else {
        document.querySelector('.tabs button:last-child').classList.add('active');
        document.getElementById('tabQuery').classList.add('active');
    }
}

// ============================================================
// 获取代理ID
// ============================================================
function getAgentId() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('agent')) || 1;
}

// ============================================================
// 加载代理商配置
// ============================================================
async function loadAgentConfig() {
    currentAgentId = getAgentId();
    try {
        const resp = await fetch(`${API_BASE}/api/agent/config?agentId=${currentAgentId}`);
        const data = await resp.json();
        if (data.code === 200) {
            agentConfig = data.data;
            document.getElementById('agentDisplay').textContent = '🏪 ' + agentConfig.agent_name;

            let html = '';
            if (agentConfig.qq) html += `<a href="http://wpa.qq.com/msgrd?v=3&uin=${agentConfig.qq}&site=qq&menu=yes" target="_blank" class="qq-btn">💬 QQ咨询</a>`;
            if (agentConfig.wechat) html += `<div class="wechat-info">📱 微信号：${agentConfig.wechat} <button class="copy-btn" onclick="copyText('${agentConfig.wechat}')">复制</button></div>`;
            if (agentConfig.qr_code_url) html += `<div><img src="${agentConfig.qr_code_url}" class="qr-img" alt="微信二维码" onerror="this.style.display='none'"></div>`;
            if (agentConfig.welcome_text) html += `<div class="welcome-text">${agentConfig.welcome_text}</div>`;
            document.getElementById('contactContent').innerHTML = html || '<span style="color:#ccc;">暂无客服信息</span>';

            document.getElementById('stockImageArea').innerHTML = agentConfig.stock_image_url ?
                `<img src="${agentConfig.stock_image_url}" class="stock-image" alt="库存图片" onerror="this.style.display='none'">` : '';

            document.getElementById('orderNoticeArea').innerHTML = agentConfig.order_notice ?
                `<div class="order-notice">📌 <strong>下单须知</strong><br>${agentConfig.order_notice.replace(/\n/g, '<br>')}</div>` : '';
        }
    } catch(e) { console.error(e); }
}

// ============================================================
// 复制
// ============================================================
function copyText(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制'));
    } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ 已复制');
    }
}

// ============================================================
// 下单
// ============================================================
async function doOrder() {
    const name = document.getElementById('oName').value.trim();
    const phone = document.getElementById('oPhone').value.trim();
    const province = document.getElementById('oProvince').value;
    const city = document.getElementById('oCity').value;
    const district = document.getElementById('oDistrict').value;
    const detailAddress = document.getElementById('oDetailAddress').value.trim();
    const note = document.getElementById('oNote').value.trim();

    if (!name) { showToast('请填写姓名'); return; }
    if (!phone || !/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号'); return; }
    if (!province) { showToast('请选择省份'); return; }
    if (!city) { showToast('请选择城市'); return; }
    if (!district) { showToast('请选择区/县'); return; }
    if (!detailAddress) { showToast('请填写详细地址'); return; }

    try {
        const resp = await fetch(`${API_BASE}/api/order/create`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customerName: name,
                customerPhone: phone,
                province: province,
                city: city,
                district: district,
                detailAddress: detailAddress,
                productNote: note,
                agentId: currentAgentId
            })
        });
        const data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 下单成功！请等待商家确认');
            document.getElementById('oName').value = '';
            document.getElementById('oPhone').value = '';
            document.getElementById('oProvince').value = '';
            document.getElementById('oCity').innerHTML = '<option value="">请选择</option>';
            document.getElementById('oDistrict').innerHTML = '<option value="">请选择</option>';
            document.getElementById('oDetailAddress').value = '';
            document.getElementById('oNote').value = '';
        } else {
            showToast(data.msg || '下单失败');
        }
    } catch(e) { showToast('网络异常，请重试'); }
}

// ============================================================
// 查询订单
// ============================================================
async function doQuery() {
    const phone = document.getElementById('qPhone').value.trim();
    if (!phone) { showToast('请输入手机号'); return; }
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号'); return; }

    const list = document.getElementById('orderList');
    list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">⏳ 查询中...</div>';

    try {
        const resp = await fetch(`${API_BASE}/api/order/query?phone=${encodeURIComponent(phone)}`);
        const data = await resp.json();

        if (data.code === 200 && data.data && data.data.length > 0) {
            const orders = data.data;
            const statusMap = ['待付款', '已付款（待确认）', '已收款', '已发货', '已拒绝'];
            const statusClass = ['s0', 's1', 's2', 's3', 's4'];
            let html = '<div style="font-size:14px;color:#666;margin-bottom:12px;">共 ' + orders.length + ' 个订单</div>';
            orders.forEach(o => {
                let actionsHtml = '';
                if (o.status === 0) {
                    actionsHtml = `
                        <button class="btn-edit" onclick="openEditModal(${o.id})">✏️ 修改订单</button>
                        <button class="btn-pay" onclick="markPaid(${o.id})">💰 我已付款</button>
                    `;
                }
                let remarksHtml = '';
                if (o.product_note) remarksHtml += `<div>📝 客户备注：${o.product_note}</div>`;
                if (o.admin_remark) remarksHtml += `<div>💬 商家备注：${o.admin_remark}</div>`;

                html += `
                    <div class="order-item" data-id="${o.id}">
                        <div class="top">
                            <span><span class="status ${statusClass[o.status] || 's0'}">${statusMap[o.status] || '未知'}</span> <strong>${o.customer_name}</strong></span>
                            <span style="color:#999;font-size:12px;">${o.created_at || ''}</span>
                        </div>
                        <div class="info">
                            <div>📍 ${o.province || ''}${o.city || ''}${o.district || ''} ${o.detail_address || ''}</div>
                            ${remarksHtml}
                            ${o.tracking_number ? `<div>📮 运单号：<span class="tracking">${o.tracking_number}</span></div>` : ''}
                            ${o.pickup_code ? `<div>🔑 取件码：<span class="pickup">${o.pickup_code}</span></div>` : ''}
                        </div>
                        ${actionsHtml ? `<div class="actions">${actionsHtml}</div>` : ''}
                    </div>
                `;
            });
            list.innerHTML = html;
        } else {
            list.innerHTML = '<div class="empty">📭 暂无订单</div>';
        }
    } catch(e) { list.innerHTML = '<div class="empty">网络异常，请刷新重试</div>'; }
}

// ============================================================
// 客户标记已付款
// ============================================================
async function markPaid(orderId) {
    if (!confirm('确认已转账给商家了吗？')) return;
    try {
        const resp = await fetch(`${API_BASE}/api/order/mark-paid`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId: orderId })
        });
        const data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 已提交付款申请，等待商家确认');
            doQuery();
        } else {
            showToast(data.msg || '操作失败');
        }
    } catch(e) { showToast('网络异常，请重试'); }
}

// ============================================================
// 修改订单弹窗
// ============================================================
async function openEditModal(orderId) {
    editingOrderId = orderId;
    try {
        const resp = await fetch(`${API_BASE}/api/order/query?phone=${document.getElementById('qPhone').value.trim()}`);
        const data = await resp.json();
        if (data.code === 200 && data.data) {
            const order = data.data.find(o => o.id === orderId);
            if (order) {
                document.getElementById('eName').value = order.customer_name || '';
                document.getElementById('ePhone').value = order.customer_phone || '';
                document.getElementById('eProvince').value = order.province || '';
                updateEditCity();
                document.getElementById('eCity').value = order.city || '';
                updateEditDistrict();
                document.getElementById('eDistrict').value = order.district || '';
                document.getElementById('eDetailAddress').value = order.detail_address || '';
                document.getElementById('eNote').value = order.product_note || '';
                document.getElementById('editModal').classList.add('show');
            }
        }
    } catch(e) { showToast('加载订单信息失败'); }
}
function closeEditModal() {
    document.getElementById('editModal').classList.remove('show');
}
async function submitEdit() {
    const name = document.getElementById('eName').value.trim();
    const phone = document.getElementById('ePhone').value.trim();
    const province = document.getElementById('eProvince').value;
    const city = document.getElementById('eCity').value;
    const district = document.getElementById('eDistrict').value;
    const detailAddress = document.getElementById('eDetailAddress').value.trim();
    const note = document.getElementById('eNote').value.trim();

    if (!name || !phone || !province || !city || !district || !detailAddress) {
        showToast('请填写完整信息');
        return;
    }
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号'); return; }

    try {
        const resp = await fetch(`${API_BASE}/api/order/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                orderId: editingOrderId,
                customerName: name,
                customerPhone: phone,
                province: province,
                city: city,
                district: district,
                detailAddress: detailAddress,
                productNote: note
            })
        });
        const data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 修改已提交，等待商家确认');
            closeEditModal();
            doQuery();
        } else {
            showToast(data.msg || '修改失败');
        }
    } catch(e) { showToast('网络异常，请重试'); }
}

// 库存图片弹窗

async function openStockModal() {
    const modal = document.getElementById('stockModal');
    const body = document.getElementById('stockModalBody');
    modal.classList.add('show');
    body.innerHTML = '<p style="color:#999;padding:20px;">加载中...</p>';

    try {
        const resp = await fetch(`${API_BASE}/api/agent/config?agentId=${currentAgentId}`);
        const data = await resp.json();
        if (data.code === 200 && data.data && data.data.stock_image_url) {
            body.innerHTML = `<img src="${data.data.stock_image_url}" alt="库存图片" onerror="this.parentElement.innerHTML='<p style=\\'color:#999;padding:20px;\\'>图片加载失败</p>'">`;
        } else {
            body.innerHTML = '<p style="color:#999;padding:20px;">暂无库存图片</p>';
        }
    } catch(e) {
        body.innerHTML = '<p style="color:#999;padding:20px;">加载失败，请刷新重试</p>';
    }
}
function closeStockModal() {
    document.getElementById('stockModal').classList.remove('show');
}
