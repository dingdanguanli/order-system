<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 快递查询</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f6fa; }
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 480px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; background: #4a6cf7; color: white; font-size: 16px; }
        button.active { background: #4a6cf7; color: white; }
        .hidden { display: none; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-bar button { flex: 1; background: #e8e8e8; color: #333; }
        .tab-bar button.active { background: #4a6cf7; color: white; }
        input, select, textarea { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .form-group { margin-bottom: 12px; }
        .form-group label { font-weight: 500; display: block; margin-bottom: 4px; }
        .address-row { display: flex; gap: 8px; }
        .address-row .form-group { flex: 1; }
        .btn-success { background: #22c55e; color: white; }
        .btn-primary { background: #4a6cf7; color: white; }
        .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 10px; z-index: 999; display: none; }
        .toast.show { display: block; }
        #agentDisplay { color: #4a6cf7; font-weight: 600; }
    </style>
</head>
<body>

<div id="toast" class="toast">提示</div>

<div class="box">
    <h1>📦 快递查询</h1>
    <p id="agentDisplay">加载中...</p>

    <div class="tab-bar">
        <button id="tabOrderBtn" class="active">📝 下单</button>
        <button id="tabQueryBtn">🔍 查订单</button>
    </div>

    <!-- 下单 -->
    <div id="tabOrder">
        <div id="stockImageArea"></div>
        <div class="form-group"><label>收件人姓名 *</label><input id="oName" placeholder="请输入姓名"></div>
        <div class="form-group"><label>手机号码 *</label><input id="oPhone" type="tel" placeholder="请输入手机号"></div>
        <div class="address-row">
            <div class="form-group"><label>省份 *</label><select id="oProvince"><option value="">请选择</option></select></div>
            <div class="form-group"><label>城市 *</label><select id="oCity"><option value="">请选择</option></select></div>
            <div class="form-group"><label>区/县 *</label><select id="oDistrict"><option value="">请选择</option></select></div>
        </div>
        <div class="form-group"><label>详细地址 *</label><input id="oDetailAddress" placeholder="街道、门牌号"></div>
        <div class="form-group"><label>商品备注</label><textarea id="oNote" rows="2" placeholder="红色款 M码 加急"></textarea></div>
        <button class="btn-success" id="submitBtn" style="width:100%;padding:14px;font-size:17px;border:none;border-radius:10px;cursor:pointer;">📝 提交订单</button>
        <div id="orderNoticeArea"></div>
        <div id="contactArea" style="margin-top:16px;padding-top:16px;border-top:1px solid #eee;text-align:center;">
            <p style="color:#999;">💬 联系客服</p>
            <div id="contactContent">加载中...</div>
        </div>
    </div>

    <!-- 查询 -->
    <div id="tabQuery" class="hidden">
        <div class="form-group"><label>输入手机号查订单 *</label><input id="qPhone" type="tel" placeholder="请输入手机号"></div>
        <button class="btn-primary" id="queryBtn" style="width:100%;padding:14px;font-size:17px;border:none;border-radius:10px;cursor:pointer;">🔍 查询我的订单</button>
        <div id="orderList" style="margin-top:16px;"></div>
    </div>
</div>

<button id="stockBtn" style="position:fixed;bottom:30px;left:20px;background:#4a6cf7;color:white;border:none;border-radius:50px;padding:12px 20px;font-size:14px;cursor:pointer;box-shadow:0 4px 15px rgba(74,108,247,0.4);">📦 查看库存</button>

<script>
// ============================================================
// 配置
// ============================================================
var API_BASE = 'https://order-api.dingdanguanli.workers.dev';

// ============================================================
// 省市区数据
// ============================================================
var regionData = {
    "广东省": { "广州市": ["天河区","白云区","番禺区","海珠区","越秀区","荔湾区","黄埔区","花都区","南沙区","从化区","增城区"], "深圳市": ["南山区","福田区","罗湖区","宝安区","龙岗区","龙华区","光明区","坪山区","盐田区","大鹏新区"], "东莞市": ["南城街道","东城街道","万江街道","莞城街道"], "佛山市": ["禅城区","南海区","顺德区","三水区","高明区"], "珠海市": ["香洲区","斗门区","金湾区"], "惠州市": ["惠城区","惠阳区","博罗县","惠东县","龙门县"], "中山市": ["石岐街道","东区街道","西区街道","南区街道"], "江门市": ["蓬江区","江海区","新会区","台山市","开平市","鹤山市","恩平市"], "肇庆市": ["端州区","鼎湖区","高要区","四会市","广宁县","怀集县","封开县","德庆县"], "汕头市": ["金平区","龙湖区","濠江区","澄海区","潮阳区","潮南区","南澳县"], "潮州市": ["湘桥区","潮安区","饶平县"], "揭阳市": ["榕城区","揭东区","揭西县","惠来县","普宁市"], "汕尾市": ["城区","海丰县","陆河县","陆丰市"], "湛江市": ["赤坎区","霞山区","坡头区","麻章区","遂溪县","徐闻县","廉江市","雷州市","吴川市"], "茂名市": ["茂南区","电白区","高州市","化州市","信宜市"], "阳江市": ["江城区","阳东区","阳西县","阳春市"], "清远市": ["清城区","清新区","佛冈县","阳山县","英德市","连州市"], "韶关市": ["浈江区","武江区","曲江区","始兴县","仁化县","翁源县","乐昌市","南雄市"], "河源市": ["源城区","紫金县","龙川县","连平县","和平县","东源县"], "梅州市": ["梅江区","梅县区","大埔县","丰顺县","五华县","平远县","蕉岭县","兴宁市"], "云浮市": ["云城区","云安区","新兴县","郁南县","罗定市"]
};
regionData["北京市"] = { "北京市": ["东城区","西城区","朝阳区","海淀区","丰台区","石景山区","通州区","大兴区","顺义区","昌平区","房山区","门头沟区","怀柔区","平谷区","密云区","延庆区"] };
regionData["上海市"] = { "上海市": ["黄浦区","徐汇区","长宁区","静安区","普陀区","虹口区","杨浦区","闵行区","宝山区","嘉定区","浦东新区","金山区","松江区","青浦区","奉贤区","崇明区"] };
regionData["浙江省"] = { "杭州市": ["上城区","拱墅区","西湖区","滨江区","萧山区","余杭区","临平区","钱塘区","富阳区","临安区","桐庐县","淳安县","建德市"], "宁波市": ["海曙区","鄞州区","江北区","北仑区","镇海区","奉化区","象山县","宁海县","余姚市","慈溪市"] };
regionData["江苏省"] = { "南京市": ["玄武区","秦淮区","建邺区","鼓楼区","浦口区","栖霞区","雨花台区","江宁区","六合区","溧水区","高淳区"], "苏州市": ["姑苏区","吴中区","相城区","吴江区","虎丘区","常熟市","张家港市","昆山市","太仓市"] };

// ============================================================
// 初始化
// ============================================================
function initProvince() {
    var sel = document.getElementById('oProvince');
    sel.innerHTML = '<option value="">请选择</option>';
    for (var p in regionData) {
        sel.innerHTML += '<option value="' + p + '">' + p + '</option>';
    }
}

function loadCity() {
    var p = document.getElementById('oProvince').value;
    var sel = document.getElementById('oCity');
    sel.innerHTML = '<option value="">请选择</option>';
    if (p && regionData[p]) {
        for (var c in regionData[p]) {
            sel.innerHTML += '<option value="' + c + '">' + c + '</option>';
        }
    }
    document.getElementById('oDistrict').innerHTML = '<option value="">请选择</option>';
}

function loadDistrict() {
    var p = document.getElementById('oProvince').value;
    var c = document.getElementById('oCity').value;
    var sel = document.getElementById('oDistrict');
    sel.innerHTML = '<option value="">请选择</option>';
    if (p && c && regionData[p] && regionData[p][c]) {
        for (var i = 0; i < regionData[p][c].length; i++) {
            sel.innerHTML += '<option value="' + regionData[p][c][i] + '">' + regionData[p][c][i] + '</option>';
        }
    }
}

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show';
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.className = 'toast'; }, 2500);
}

// ============================================================
// Tab切换
// ============================================================
function switchTab(tab) {
    var btn1 = document.getElementById('tabOrderBtn');
    var btn2 = document.getElementById('tabQueryBtn');
    var panel1 = document.getElementById('tabOrder');
    var panel2 = document.getElementById('tabQuery');
    if (tab === 'order') {
        btn1.className = 'active';
        btn2.className = '';
        panel1.className = '';
        panel2.className = 'hidden';
    } else {
        btn1.className = '';
        btn2.className = 'active';
        panel1.className = 'hidden';
        panel2.className = '';
    }
}

// ============================================================
// 获取代理ID
// ============================================================
function getAgentId() {
    var params = new URLSearchParams(window.location.search);
    return parseInt(params.get('agent')) || 1;
}

// ============================================================
// 加载配置
// ============================================================
async function loadAgentConfig() {
    var agentId = getAgentId();
    try {
        var resp = await fetch(API_BASE + '/api/agent/config?agentId=' + agentId);
        var data = await resp.json();
        if (data.code === 200) {
            var cfg = data.data;
            document.getElementById('agentDisplay').textContent = '🏪 ' + cfg.agent_name;
            var html = '';
            if (cfg.qq) html += '<a href="http://wpa.qq.com/msgrd?v=3&uin=' + cfg.qq + '&site=qq&menu=yes" target="_blank" style="display:inline-block;padding:10px 28px;background:#4a6cf7;color:white;border-radius:10px;text-decoration:none;font-weight:500;">💬 QQ咨询</a>';
            if (cfg.wechat) html += '<div style="margin-top:8px;color:#666;">📱 微信号：' + cfg.wechat + '</div>';
            if (cfg.stock_image_url) {
                document.getElementById('stockImageArea').innerHTML = '<img src="' + cfg.stock_image_url + '" style="width:100%;border-radius:12px;margin-bottom:16px;">';
            }
            if (cfg.order_notice) {
                document.getElementById('orderNoticeArea').innerHTML = '<div style="background:#f8f9fa;border-radius:10px;padding:12px 16px;margin-top:16px;font-size:14px;color:#666;border-left:3px solid #4a6cf7;">📌 <strong>下单须知</strong><br>' + cfg.order_notice.replace(/\n/g, '<br>') + '</div>';
            }
            document.getElementById('contactContent').innerHTML = html || '<span style="color:#ccc;">暂无客服信息</span>';
        }
    } catch(e) {
        document.getElementById('agentDisplay').textContent = '🏪 加载失败，请刷新';
        console.error(e);
    }
}

// ============================================================
// 下单
// ============================================================
async function doOrder() {
    var name = document.getElementById('oName').value.trim();
    var phone = document.getElementById('oPhone').value.trim();
    var province = document.getElementById('oProvince').value;
    var city = document.getElementById('oCity').value;
    var district = document.getElementById('oDistrict').value;
    var addr = document.getElementById('oDetailAddress').value.trim();
    var note = document.getElementById('oNote').value.trim();

    if (!name) { showToast('请填写姓名'); return; }
    if (!phone || !/^1\d{10}$/.test(phone)) { showToast('请输入正确手机号'); return; }
    if (!province) { showToast('请选择省份'); return; }
    if (!city) { showToast('请选择城市'); return; }
    if (!district) { showToast('请选择区/县'); return; }
    if (!addr) { showToast('请填写详细地址'); return; }

    try {
        var resp = await fetch(API_BASE + '/api/order/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customerName: name,
                customerPhone: phone,
                province: province,
                city: city,
                district: district,
                detailAddress: addr,
                productNote: note,
                agentId: getAgentId()
            })
        });
        var data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 下单成功！');
            document.getElementById('oName').value = '';
            document.getElementById('oPhone').value = '';
            document.getElementById('oProvince').value = '';
            document.getElementById('oCity').innerHTML = '<option value="">请选择</option>';
            document.getElementById('oDistrict').innerHTML = '<option value="">请选择</option>';
            document.getElementById('oDetailAddress').value = '';
            document.getElementById('oNote').value = '';
        } else {
            showToast(data.msg || '下单失败');
        }
    } catch(e) { showToast('网络异常，请重试'); }
}

// ============================================================
// 查询
// ============================================================
async function doQuery() {
    var phone = document.getElementById('qPhone').value.trim();
    if (!phone) { showToast('请输入手机号'); return; }
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确手机号'); return; }

    var list = document.getElementById('orderList');
    list.innerHTML = '查询中...';

    try {
        var resp = await fetch(API_BASE + '/api/order/query?phone=' + encodeURIComponent(phone));
        var data = await resp.json();
        if (data.code === 200 && data.data && data.data.length > 0) {
            var orders = data.data;
            var statusMap = ['待付款','已付款（待确认）','已收款','已发货','已拒绝'];
            var cls = ['s0','s1','s2','s3','s4'];
            var html = '';
            for (var i = 0; i < orders.length; i++) {
                var o = orders[i];
                var actions = '';
                if (o.status === 0) {
                    actions = '<button onclick="alert(\'修改功能\')" style="padding:6px 16px;background:#4a6cf7;color:white;border:none;border-radius:6px;cursor:pointer;">✏️ 修改</button><button onclick="markPaid(' + o.id + ')" style="padding:6px 16px;background:#22c55e;color:white;border:none;border-radius:6px;cursor:pointer;">💰 我已付款</button>';
                }
                html += '<div style="border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:12px;">';
                html += '<div><span style="background:#fff3cd;padding:2px 12px;border-radius:20px;font-size:12px;">' + statusMap[o.status] + '</span> <strong>' + o.customer_name + '</strong> <span style="color:#999;font-size:12px;">' + (o.created_at || '') + '</span></div>';
                html += '<div style="margin-top:6px;color:#666;font-size:14px;">📍 ' + (o.province||'') + (o.city||'') + (o.district||'') + ' ' + (o.detail_address||'') + '</div>';
                if (o.product_note) html += '<div>📝 客户备注：' + o.product_note + '</div>';
                if (o.admin_remark) html += '<div>💬 商家备注：' + o.admin_remark + '</div>';
                if (o.tracking_number) html += '<div>📮 运单号：' + o.tracking_number + '</div>';
                if (o.pickup_code) html += '<div>🔑 取件码：<strong style="color:#ff6b00;font-size:18px;">' + o.pickup_code + '</strong></div>';
                if (actions) html += '<div style="margin-top:10px;display:flex;gap:8px;">' + actions + '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        } else {
            list.innerHTML = '📭 暂无订单';
        }
    } catch(e) {
        list.innerHTML = '网络异常，请刷新重试';
        console.error(e);
    }
}

// ============================================================
// 标记已付款
// ============================================================
async function markPaid(id) {
    if (!confirm('确认已转账给商家了吗？')) return;
    try {
        var resp = await fetch(API_BASE + '/api/order/mark-paid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId: id })
        });
        var data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 已提交付款申请');
            doQuery();
        } else {
            showToast(data.msg || '操作失败');
        }
    } catch(e) { showToast('网络异常，请重试'); }
}

// ============================================================
// 库存
// ============================================================
async function openStock() {
    var agentId = getAgentId();
    try {
        var resp = await fetch(API_BASE + '/api/agent/config?agentId=' + agentId);
        var data = await resp.json();
        if (data.code === 200 && data.data && data.data.stock_image_url) {
            var win = window.open('', '_blank', 'width=500,height=600');
            win.document.write('<html><head><title>库存图片</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:rgba(0,0,0,0.8);}img{max-width:90%;max-height:90%;border-radius:8px;}</style></head><body><img src="' + data.data.stock_image_url + '" onerror="this.alt=\'图片加载失败\'"></body></html>');
            win.document.close();
        } else {
            showToast('暂无库存图片');
        }
    } catch(e) { showToast('加载失败'); }
}

// ============================================================
// 绑定事件
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    initProvince();

    document.getElementById('oProvince').addEventListener('change', loadCity);
    document.getElementById('oCity').addEventListener('change', loadDistrict);

    document.getElementById('tabOrderBtn').addEventListener('click', function() { switchTab('order'); });
    document.getElementById('tabQueryBtn').addEventListener('click', function() { switchTab('query'); });

    document.getElementById('submitBtn').addEventListener('click', doOrder);
    document.getElementById('queryBtn').addEventListener('click', doQuery);
    document.getElementById('qPhone').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') doQuery();
    });

    document.getElementById('stockBtn').addEventListener('click', openStock);

    loadAgentConfig();
});

// 暴露给全局
window.markPaid = markPaid;
window.doQuery = doQuery;
window.openStock = openStock;
window.showToast = showToast;
</script>
</body>
</html>
