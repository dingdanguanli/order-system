<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📦 快递查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, Arial, sans-serif; background: #f5f6fa; padding: 16px; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; padding: 16px 0 12px; }
        .header h1 { font-size: 26px; color: #333; }
        .header .agent-name { color: #4a6cf7; font-weight: 600; font-size: 15px; display: block; margin-top: 4px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: white; border-radius: 12px; padding: 4px; }
        .tabs button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; background: transparent; color: #999; }
        .tabs button.active { background: #4a6cf7; color: white; }

        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; display: none; }
        .card.active { display: block; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 4px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; background: #fafafa; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #4a6cf7; background: white; }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .address-row { display: flex; gap: 8px; }
        .address-row .form-group { flex: 1; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 17px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #4a6cf7; color: white; }
        .btn-primary:active { background: #3a56d4; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:active { background: #16a34a; }

        .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: white; padding: 12px 24px; border-radius: 10px; font-size: 15px; z-index: 999; display: none; max-width: 80%; text-align: center; }
        .toast.show { display: block; }

        .order-item { border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .order-item .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
        .order-item .top .status { font-size: 12px; padding: 2px 12px; border-radius: 20px; }
        .order-item .top .status.s0 { background: #fff3cd; color: #856404; }
        .order-item .top .status.s1 { background: #cce5ff; color: #004085; }
        .order-item .top .status.s2 { background: #d4edda; color: #155724; }
        .order-item .top .status.s3 { background: #d4edda; color: #155724; }
        .order-item .top .status.s4 { background: #f8d7da; color: #721c24; }
        .order-item .info { font-size: 14px; color: #666; line-height: 1.8; margin-top: 6px; }
        .order-item .info .pickup { font-size: 20px; font-weight: 700; color: #ff6b00; }
        .order-item .info .tracking { color: #333; font-weight: 500; }
        .order-item .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        .order-item .actions button { padding: 6px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
        .order-item .actions .btn-edit { background: #4a6cf7; color: white; }
        .order-item .actions .btn-pay { background: #22c55e; color: white; }

        .empty { text-align: center; color: #bbb; padding: 30px 0; }

        .contact-area { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; text-align: center; }
        .contact-area .qq-btn { display: inline-block; padding: 10px 28px; background: #4a6cf7; color: white; border-radius: 10px; text-decoration: none; font-weight: 500; font-size: 15px; }
        .contact-area .wechat-info { margin-top: 8px; color: #666; font-size: 14px; }
        .contact-area .qr-img { max-width: 140px; margin-top: 8px; border-radius: 8px; }
        .contact-area .welcome-text { margin-top: 8px; font-size: 13px; color: #999; }

        .stock-image { width: 100%; border-radius: 12px; margin-bottom: 16px; }
        .order-notice { background: #f8f9fa; border-radius: 10px; padding: 12px 16px; margin-top: 16px; font-size: 14px; color: #666; line-height: 1.8; border-left: 3px solid #4a6cf7; }
        .copy-btn { background: none; border: 1px solid #ddd; padding: 2px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; color: #666; }
        .copy-btn:active { background: #f0f0f0; }

        .stock-fab {
            position: fixed;
            bottom: 30px;
            left: 20px;
            z-index: 999;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.4);
            cursor: pointer;
        }
        .stock-fab:active { transform: scale(0.95); }

        .stock-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .stock-modal.show { display: flex; }
        .stock-modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            position: relative;
        }
        .stock-modal-content img { max-width: 100%; max-height: 70vh; border-radius: 8px; }
        .stock-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }

        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .edit-modal.show { display: flex; }
        .edit-modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            max-height: 90%;
            overflow-y: auto;
            position: relative;
        }
        .edit-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }
        .edit-modal-content .form-group { margin-bottom: 12px; }
        .edit-modal-content .btn { margin-top: 8px; }
        .copy-btn { background: none; border: 1px solid #ddd; padding: 2px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; color: #666; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <div class="header">
        <h1>📦 快递查询</h1>
        <span class="agent-name" id="agentDisplay">加载中...</span>
    </div>

    <div class="tabs">
        <button class="active" id="tabOrderBtn">📝 下单</button>
        <button id="tabQueryBtn">🔍 查订单</button>
    </div>

    <!-- 下单 -->
    <div id="tabOrder" class="card active">
        <div id="stockImageArea"></div>
        <div class="form-group">
            <label>收件人姓名 *</label>
            <input id="oName" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>手机号码 *</label>
            <input id="oPhone" type="tel" placeholder="请输入手机号">
        </div>
        <div class="address-row">
            <div class="form-group">
                <label>省份 *</label>
                <select id="oProvince"><option value="">请选择</option></select>
            </div>
            <div class="form-group">
                <label>城市 *</label>
                <select id="oCity"><option value="">请选择</option></select>
            </div>
            <div class="form-group">
                <label>区/县 *</label>
                <select id="oDistrict"><option value="">请选择</option></select>
            </div>
        </div>
        <div class="form-group">
            <label>详细地址 *</label>
            <input id="oDetailAddress" placeholder="街道、门牌号等">
        </div>
        <div class="form-group">
            <label>商品备注</label>
            <textarea id="oNote" placeholder="如：红色款 M码 加急"></textarea>
        </div>
        <button class="btn btn-success" id="submitBtn">📝 提交订单</button>
        <div id="orderNoticeArea"></div>
        <div class="contact-area">
            <p style="color:#999;font-size:14px;margin-bottom:8px;">💬 联系客服</p>
            <div id="contactContent">加载中...</div>
        </div>
    </div>

    <!-- 查询 -->
    <div id="tabQuery" class="card">
        <div class="form-group">
            <label>输入手机号查订单 *</label>
            <input id="qPhone" type="tel" placeholder="请输入下单时的手机号">
        </div>
        <button class="btn btn-primary" id="queryBtn">🔍 查询我的订单</button>
        <div id="orderList" style="margin-top:16px;"></div>
    </div>
</div>

<!-- 查看库存 -->
<button class="stock-fab" id="stockFab">📦 查看库存</button>

<!-- 库存弹窗 -->
<div class="stock-modal" id="stockModal">
    <div class="stock-modal-content">
        <button class="stock-modal-close" id="stockModalClose">✕</button>
        <div id="stockModalBody" style="text-align:center;"><p style="color:#999;padding:20px;">加载中...</p></div>
    </div>
</div>

<!-- 修改订单弹窗 -->
<div class="edit-modal" id="editModal">
    <div class="edit-modal-content">
        <button class="edit-modal-close" id="editModalClose">✕</button>
        <h3 style="margin-bottom:16px;">✏️ 修改订单</h3>
        <div id="editForm">
            <div class="form-group"><label>收件人姓名 *</label><input id="eName" placeholder="请输入姓名"></div>
            <div class="form-group"><label>手机号码 *</label><input id="ePhone" type="tel" placeholder="请输入手机号"></div>
            <div class="address-row">
                <div class="form-group"><label>省份 *</label><select id="eProvince"><option value="">请选择</option></select></div>
                <div class="form-group"><label>城市 *</label><select id="eCity"><option value="">请选择</option></select></div>
                <div class="form-group"><label>区/县 *</label><select id="eDistrict"><option value="">请选择</option></select></div>
            </div>
            <div class="form-group"><label>详细地址 *</label><input id="eDetailAddress" placeholder="街道、门牌号等"></div>
            <div class="form-group"><label>商品备注</label><textarea id="eNote" placeholder="如：红色款 M码 加急"></textarea></div>
            <button class="btn btn-success" id="submitEditBtn">✅ 确认修改</button>
        </div>
    </div>
</div>

<script>
var API_BASE = 'https://order-api.dingdanguanli.workers.dev';
var currentAgentId = 1;

var regionData = {
    "广东省": { "广州市": ["天河区","白云区","番禺区","海珠区","越秀区","荔湾区","黄埔区","花都区","南沙区","从化区","增城区"], "深圳市": ["南山区","福田区","罗湖区","宝安区","龙岗区","龙华区","光明区","坪山区","盐田区","大鹏新区"] },
    "北京市": { "北京市": ["东城区","西城区","朝阳区","海淀区","丰台区","石景山区","通州区","大兴区","顺义区","昌平区","房山区","门头沟区","怀柔区","平谷区","密云区","延庆区"] },
    "上海市": { "上海市": ["黄浦区","徐汇区","长宁区","静安区","普陀区","虹口区","杨浦区","闵行区","宝山区","嘉定区","浦东新区","金山区","松江区","青浦区","奉贤区","崇明区"] }
};

function initProvince() {
    var sel = document.getElementById('oProvince');
    sel.innerHTML = '<option value="">请选择</option>';
    for (var p in regionData) {
        sel.innerHTML += '<option value="' + p + '">' + p + '</option>';
    }
    var sel2 = document.getElementById('eProvince');
    sel2.innerHTML = '<option value="">请选择</option>';
    for (var p in regionData) {
        sel2.innerHTML += '<option value="' + p + '">' + p + '</option>';
    }
}

function loadCity() {
    var p = document.getElementById('oProvince').value;
    var sel = document.getElementById('oCity');
    sel.innerHTML = '<option value="">请选择</option>';
    if (p && regionData[p]) {
        for (var c in regionData[p]) {
            sel.innerHTML += '<option value="' + c + '">' + c + '</option>';
        }
    }
    document.getElementById('oDistrict').innerHTML = '<option value="">请选择</option>';
}

function loadDistrict() {
    var p = document.getElementById('oProvince').value;
    var c = document.getElementById('oCity').value;
    var sel = document.getElementById('oDistrict');
    sel.innerHTML = '<option value="">请选择</option>';
    if (p && c && regionData[p] && regionData[p][c]) {
        for (var i = 0; i < regionData[p][c].length; i++) {
            sel.innerHTML += '<option value="' + regionData[p][c][i] + '">' + regionData[p][c][i] + '</option>';
        }
    }
}

function loadEditCity() {
    var p = document.getElementById('eProvince').value;
    var sel = document.getElementById('eCity');
    sel.innerHTML = '<option value="">请选择</option>';
    if (p && regionData[p]) {
        for (var c in regionData[p]) {
            sel.innerHTML += '<option value="' + c + '">' + c + '</option>';
        }
    }
    document.getElementById('eDistrict').innerHTML = '<option value="">请选择</option>';
}

function loadEditDistrict() {
    var p = document.getElementById('eProvince').value;
    var c = document.getElementById('eCity').value;
    var sel = document.getElementById('eDistrict');
    sel.innerHTML = '<option value="">请选择</option>';
    if (p && c && regionData[p] && regionData[p][c]) {
        for (var i = 0; i < regionData[p][c].length; i++) {
            sel.innerHTML += '<option value="' + regionData[p][c][i] + '">' + regionData[p][c][i] + '</option>';
        }
    }
}

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show';
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.className = 'toast'; }, 2500);
}

function switchTab(tab) {
    var btn1 = document.getElementById('tabOrderBtn');
    var btn2 = document.getElementById('tabQueryBtn');
    var panel1 = document.getElementById('tabOrder');
    var panel2 = document.getElementById('tabQuery');
    if (tab === 'order') {
        btn1.className = 'active';
        btn2.className = '';
        panel1.className = 'card active';
        panel2.className = 'card';
    } else {
        btn1.className = '';
        btn2.className = 'active';
        panel1.className = 'card';
        panel2.className = 'card active';
    }
}

function getAgentId() {
    var params = new URLSearchParams(window.location.search);
    return parseInt(params.get('agent')) || 1;
}

async function loadAgentConfig() {
    currentAgentId = getAgentId();
    try {
        var resp = await fetch(API_BASE + '/api/agent/config?agentId=' + currentAgentId);
        var data = await resp.json();
        if (data.code === 200) {
            var cfg = data.data;
            document.getElementById('agentDisplay').textContent = '🏪 ' + cfg.agent_name;
            var html = '';
            if (cfg.qq) html += '<a href="http://wpa.qq.com/msgrd?v=3&uin=' + cfg.qq + '&site=qq&menu=yes" target="_blank" class="qq-btn">💬 QQ咨询</a>';
            if (cfg.wechat) html += '<div class="wechat-info">📱 微信号：' + cfg.wechat + '</div>';
            document.getElementById('contactContent').innerHTML = html || '<span style="color:#ccc;">暂无客服信息</span>';
            if (cfg.stock_image_url) {
                document.getElementById('stockImageArea').innerHTML = '<img src="' + cfg.stock_image_url + '" class="stock-image" alt="库存图片">';
            }
            if (cfg.order_notice) {
                document.getElementById('orderNoticeArea').innerHTML = '<div class="order-notice">📌 <strong>下单须知</strong><br>' + cfg.order_notice.replace(/\n/g, '<br>') + '</div>';
            }
        }
    } catch(e) { console.error(e); }
}

async function doOrder() {
    var name = document.getElementById('oName').value.trim();
    var phone = document.getElementById('oPhone').value.trim();
    var province = document.getElementById('oProvince').value;
    var city = document.getElementById('oCity').value;
    var district = document.getElementById('oDistrict').value;
    var addr = document.getElementById('oDetailAddress').value.trim();
    var note = document.getElementById('oNote').value.trim();

    if (!name) { showToast('请填写姓名'); return; }
    if (!phone || !/^1\d{10}$/.test(phone)) { showToast('请输入正确手机号'); return; }
    if (!province) { showToast('请选择省份'); return; }
    if (!city) { showToast('请选择城市'); return; }
    if (!district) { showToast('请选择区/县'); return; }
    if (!addr) { showToast('请填写详细地址'); return; }

    try {
        var resp = await fetch(API_BASE + '/api/order/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customerName: name,
                customerPhone: phone,
                province: province,
                city: city,
                district: district,
                detailAddress: addr,
                productNote: note,
                agentId: currentAgentId
            })
        });
        var data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 下单成功！');
            document.getElementById('oName').value = '';
            document.getElementById('oPhone').value = '';
            document.getElementById('oProvince').value = '';
            document.getElementById('oCity').innerHTML = '<option value="">请选择</option>';
            document.getElementById('oDistrict').innerHTML = '<option value="">请选择</option>';
            document.getElementById('oDetailAddress').value = '';
            document.getElementById('oNote').value = '';
        } else {
            showToast(data.msg || '下单失败');
        }
    } catch(e) { showToast('网络异常，请重试'); }
}

async function doQuery() {
    var phone = document.getElementById('qPhone').value.trim();
    if (!phone) { showToast('请输入手机号'); return; }
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确手机号'); return; }

    var list = document.getElementById('orderList');
    list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">⏳ 查询中...</div>';

    try {
        var resp = await fetch(API_BASE + '/api/order/query?phone=' + encodeURIComponent(phone));
        var data = await resp.json();

        if (data.code === 200 && data.data && data.data.length > 0) {
            var orders = data.data;
            var statusMap = ['待付款','已付款（待确认）','已收款','已发货','已拒绝'];
            var statusCls = ['s0','s1','s2','s3','s4'];
            var html = '<div style="font-size:14px;color:#666;margin-bottom:12px;">共 ' + orders.length + ' 个订单</div>';
            for (var i = 0; i < orders.length; i++) {
                var o = orders[i];
                var actions = '';
                if (o.status === 0) {
                    actions = '<button class="btn-edit" onclick="alert(\'修改功能开发中\')">✏️ 修改订单</button><button class="btn-pay" onclick="markPaid(' + o.id + ')">💰 我已付款</button>';
                }
                html += '<div class="order-item"><div class="top"><span><span class="status ' + statusCls[o.status] + '">' + statusMap[o.status] + '</span> <strong>' + o.customer_name + '</strong></span><span style="color:#999;font-size:12px;">' + (o.created_at || '') + '</span></div><div class="info"><div>📍 ' + (o.province||'') + (o.city||'') + (o.district||'') + ' ' + (o.detail_address||'') + '</div>' + (o.tracking_number ? '<div>📮 运单号：<span class="tracking">' + o.tracking_number + '</span></div>' : '') + (o.pickup_code ? '<div>🔑 取件码：<span class="pickup">' + o.pickup_code + '</span></div>' : '') + '</div>' + (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>';
            }
            list.innerHTML = html;
        } else {
            list.innerHTML = '<div class="empty">📭 暂无订单</div>';
        }
    } catch(e) { list.innerHTML = '<div class="empty">网络异常，请刷新重试</div>'; }
}

async function markPaid(id) {
    if (!confirm('确认已转账给商家了吗？')) return;
    try {
        var resp = await fetch(API_BASE + '/api/order/mark-paid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId: id })
        });
        var data = await resp.json();
        if (data.code === 200) {
            showToast('✅ 已提交付款申请');
            doQuery();
        } else {
            showToast(data.msg || '操作失败');
        }
    } catch(e) { showToast('网络异常，请重试'); }
}

async function openStock() {
    var modal = document.getElementById('stockModal');
    var body = document.getElementById('stockModalBody');
    modal.className = 'stock-modal show';
    body.innerHTML = '<p style="color:#999;padding:20px;">加载中...</p>';
    try {
        var resp = await fetch(API_BASE + '/api/agent/config?agentId=' + currentAgentId);
        var data = await resp.json();
        if (data.code === 200 && data.data && data.data.stock_image_url) {
            body.innerHTML = '<img src="' + data.data.stock_image_url + '" alt="库存图片">';
        } else {
            body.innerHTML = '<p style="color:#999;padding:20px;">暂无库存图片</p>';
        }
    } catch(e) {
        body.innerHTML = '<p style="color:#999;padding:20px;">加载失败</p>';
    }
}

function closeStock() {
    document.getElementById('stockModal').className = 'stock-modal';
}

document.addEventListener('DOMContentLoaded', function() {
    initProvince();
    document.getElementById('oProvince').addEventListener('change', loadCity);
    document.getElementById('oCity').addEventListener('change', loadDistrict);
    document.getElementById('eProvince').addEventListener('change', loadEditCity);
    document.getElementById('eCity').addEventListener('change', loadEditDistrict);

    document.getElementById('tabOrderBtn').addEventListener('click', function() { switchTab('order'); });
    document.getElementById('tabQueryBtn').addEventListener('click', function() { switchTab('query'); });

    document.getElementById('submitBtn').addEventListener('click', doOrder);
    document.getElementById('queryBtn').addEventListener('click', doQuery);
    document.getElementById('qPhone').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') doQuery();
    });

    document.getElementById('stockFab').addEventListener('click', openStock);
    document.getElementById('stockModalClose').addEventListener('click', closeStock);
    document.getElementById('stockModal').addEventListener('click', function(e) {
        if (e.target === this) closeStock();
    });

    loadAgentConfig();
});

window.doOrder = doOrder;
window.doQuery = doQuery;
window.markPaid = markPaid;
window.openStock = openStock;
window.closeStock = closeStock;
</script>
</body>
</html>
