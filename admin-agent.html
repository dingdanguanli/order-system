<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔐 代理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, Arial, sans-serif; background: #f0f2f5; padding: 12px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; }

        .login-box { background: white; max-width: 360px; margin: 60px auto; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .login-box h2 { text-align: center; font-size: 20px; margin-bottom: 4px; }
        .login-box p.sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 20px; }
        .login-box select, .login-box input { width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin-bottom: 12px; background: #fafafa; }
        .login-box select:focus, .login-box input:focus { outline: none; border-color: #4a6cf7; background: white; }
        .login-box button { width: 100%; padding: 14px; background: #4a6cf7; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 600; cursor: pointer; }
        .login-box button:active { background: #3a56d4; }
        .login-error { color: #ff4757; text-align: center; font-size: 14px; margin-top: 12px; display: none; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 18px; color: #333; }
        .header .info { font-size: 13px; color: #999; }
        .header .logout-btn { background: none; border: 1px solid #ddd; padding: 6px 16px; border-radius: 8px; font-size: 13px; color: #666; cursor: pointer; }

        .stats { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .stats .stat-item { background: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #666; border: 1px solid #eee; cursor: pointer; }
        .stats .stat-item.active { background: #4a6cf7; color: white; border-color: #4a6cf7; }
        .stats .stat-item .num { font-weight: 700; margin-right: 2px; }

        .order-card { background: white; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .order-card .top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 4px; }
        .order-card .top .name { font-weight: 600; font-size: 15px; color: #333; }
        .order-card .top .phone { color: #666; font-size: 13px; }
        .order-card .top .time { color: #bbb; font-size: 11px; }
        .order-card .info { margin-top: 6px; font-size: 13px; color: #666; line-height: 1.8; }
        .order-card .info .tracking { color: #333; font-weight: 500; }
        .order-card .info .pickup { color: #ff6b00; font-weight: 700; font-size: 16px; }

        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .badge.shipped { background: #d4edda; color: #155724; }
        .badge.rejected { background: #f8d7da; color: #721c24; }

        .empty-tip, .loading { text-align: center; color: #ccc; padding: 30px 0; font-size: 14px; }
        .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: white; padding: 10px 20px; border-radius: 10px; font-size: 14px; z-index: 999; display: none; max-width: 80%; text-align: center; }
        .toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        .readonly-tip { text-align: center; color: #4a6cf7; background: #eef2ff; padding: 8px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <!-- ====== 登录界面 ====== -->
    <div id="loginBox" class="login-box">
        <h2>🔐 代理后台</h2>
        <p class="sub">选择你的仓库并输入密码</p>
        <select id="agentSelect">
            <option value="1">深圳总仓1001</option>
            <option value="2">深圳总仓1002</option>
            <option value="3">深圳总仓1003</option>
            <option value="4">深圳总仓1004</option>
            <option value="5">深圳总仓1005</option>
            <option value="6">深圳总仓1006</option>
            <option value="7">深圳总仓1007</option>
            <option value="8">深圳总仓1008</option>
            <option value="9">深圳总仓1009</option>
            <option value="10">深圳总仓1010</option>
        </select>
        <input id="pwdInput" type="password" placeholder="请输入密码" onkeyup="if(event.keyCode===13) doLogin()">
        <button onclick="doLogin()">登 录</button>
        <p id="loginError" class="login-error">❌ 密码错误，请重试</p>
        <div style="text-align:center;margin-top:12px;font-size:12px;color:#ccc;">
            默认密码: Aa1001, Aa1002 ... Aa1010
        </div>
    </div>

    <!-- ====== 管理界面（只读） ====== -->
    <div id="adminPanel" style="display:none;">
        <div class="header">
            <div>
                <h1>📦 代理订单查看</h1>
                <span class="info" id="agentInfo">深圳总仓1001（只读）</span>
            </div>
            <button class="logout-btn" onclick="doLogout()">退出</button>
        </div>

        <div class="readonly-tip">🔒 当前为只读模式，你只能查看自己客户的订单数据</div>

        <div class="stats" id="statsBar">
            <span class="stat-item active" data-status="all" onclick="loadOrders('all',this)">全部 <span class="num" id="countAll">0</span></span>
            <span class="stat-item" data-status="0" onclick="loadOrders('0',this)">⏳ 待处理 <span class="num" id="count0">0</span></span>
            <span class="stat-item" data-status="1" onclick="loadOrders('1',this)">✅ 已发货 <span class="num" id="count1">0</span></span>
            <span class="stat-item" data-status="2" onclick="loadOrders('2',this)">❌ 已拒绝 <span class="num" id="count2">0</span></span>
        </div>

        <div id="orderList"></div>
    </div>
</div>

<script>
// ============================================================
// 配置
// ============================================================
const API_BASE = 'https://order-api.dingdanguanli.workers.dev';

const AGENT_PASSWORDS = {
    1: 'Aa1001',
    2: 'Aa1002',
    3: 'Aa1003',
    4: 'Aa1004',
    5: 'Aa1005',
    6: 'Aa1006',
    7: 'Aa1007',
    8: 'Aa1008',
    9: 'Aa1009',
    10: 'Aa1010'
};

const AGENT_NAMES = {
    1: '深圳总仓1001',
    2: '深圳总仓1002',
    3: '深圳总仓1003',
    4: '深圳总仓1004',
    5: '深圳总仓1005',
    6: '深圳总仓1006',
    7: '深圳总仓1007',
    8: '深圳总仓1008',
    9: '深圳总仓1009',
    10: '深圳总仓1010'
};

let currentAgentId = 1;

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// 登录
// ============================================================
function doLogin() {
    const agentId = parseInt(document.getElementById('agentSelect').value);
    const pwd = document.getElementById('pwdInput').value.trim();
    const correctPwd = AGENT_PASSWORDS[agentId];

    if (pwd === correctPwd) {
        currentAgentId = agentId;
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('agentInfo').textContent = AGENT_NAMES[agentId] + '（只读）';
        loadOrders('all');
    } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
    }
}

function doLogout() {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('pwdInput').value = '';
    document.getElementById('loginError').style.display = 'none';
}

// ============================================================
// 加载订单列表
// ============================================================
async function loadOrders(status, el) {
    document.querySelectorAll('#statsBar .stat-item').forEach(item => item.classList.remove('active'));
    if (el) el.classList.add('active');

    const list = document.getElementById('orderList');
    list.innerHTML = '<div class="loading">⏳ 加载中...</div>';

    try {
        const resp = await fetch(`${API_BASE}/api/agent/orders?agentId=${currentAgentId}&password=${AGENT_PASSWORDS[currentAgentId]}&status=${status}`);
        const data = await resp.json();

        if (data.code === 401) {
            showToast('密码错误，请重新登录');
            doLogout();
            return;
        }

        if (data.code === 200 && data.data) {
            const orders = data.data;
            renderOrders(orders);
            updateCounts(orders);
        } else {
            list.innerHTML = '<div class="empty-tip">暂无订单</div>';
        }
    } catch (e) {
        list.innerHTML = '<div class="empty-tip">加载失败，请刷新</div>';
        console.error(e);
    }
}

function renderOrders(orders) {
    const list = document.getElementById('orderList');
    if (!orders || orders.length === 0) {
        list.innerHTML = '<div class="empty-tip">🎉 暂无订单</div>';
        return;
    }

    const statusMap = ['待处理', '已发货', '已拒绝'];
    const statusClass = ['pending', 'shipped', 'rejected'];

    let html = '';
    orders.forEach(order => {
        html += `
            <div class="order-card">
                <div class="top">
                    <div>
                        <span class="badge ${statusClass[order.status] || 'pending'}">${statusMap[order.status] || '未知'}</span>
                        <span class="name">${order.customer_name}</span>
                        <span class="phone">${order.customer_phone}</span>
                    </div>
                    <span class="time">${order.created_at || ''}</span>
                </div>
                <div class="info">
                    <div>📍 ${order.customer_address}</div>
                    <div>📝 ${order.product_note || '无备注'}</div>
                    <div>📮 运单号：<span class="tracking">${order.tracking_number || '未录入'}</span></div>
                    <div>🔑 取件码：<span class="pickup">${order.pickup_code || '暂无'}</span></div>
                    ${order.admin_remark ? `<div>💬 ${order.admin_remark}</div>` : ''}
                </div>
            </div>
        `;
    });
    list.innerHTML = html;
}

// ============================================================
// 更新统计数
// ============================================================
function updateCounts(orders) {
    const counts = { 0: 0, 1: 0, 2: 0 };
    orders.forEach(o => {
        if (counts[o.status] !== undefined) counts[o.status]++;
    });
    document.getElementById('countAll').textContent = orders.length;
    document.getElementById('count0').textContent = counts[0];
    document.getElementById('count1').textContent = counts[1];
    document.getElementById('count2').textContent = counts[2];
}
</script>
</body>
</html>
